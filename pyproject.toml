[tool.poetry]
name = "ddd-structure"
version = "1.0.0"
description = "Referência de Domain-Driven Design (Eric Evans) em Python: bounded contexts, agregados, eventos de domínio, Unit of Work e arquitetura em camadas verificada por contrato."
authors = ["Matheus Lobo Camara <matheusloboo2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/LoboProgrammingg/DDD-Structure"
keywords = ["ddd", "domain-driven-design", "clean-architecture", "fastapi", "sqlalchemy"]
readme = "README.md"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.14.3"
pydantic-settings = "^2.16.2"
typer = ">=0.28,<0.30"
rich = "^15.0.0"
fastapi = "^0.162.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.1.8"}
aiosqlite = "^0.22.1"
asyncpg = "^0.32.0"
alembic = "^1.20.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
mypy = "^2.4.1"
ruff = "^0.17.4"
pre-commit = "^4.7.0"
pytest-asyncio = "^1.4.1.post1"
import-linter = "^2.16"
httpx = "^0.28.1"

[tool.poetry.scripts]
task-cli = "app.interfaces.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ----------------------------------------------------------------------------
# Ruff: lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "ERA", "RUF",
    "N", "RET", "TC", "PL", "ASYNC", "PT",
]
ignore = [
    "PLR2004",  # números mágicos são legíveis nos testes de invariantes
    "PLR0913",  # construtores de reconstituição de agregados recebem todo o estado
    "N818",     # nomes de erro seguem a Linguagem Ubíqua (InvariantViolation, TaskIsClosed)
    "RUF001",   # textos em pt-BR usam aspas e acentos tipográficos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]
"src/app/infrastructure/database/models/*" = ["RUF012"]  # __mapper_args__ é API declarativa do SQLAlchemy

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------------
# Mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/interfaces/cli/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod", "raise NotImplementedError"]

# ----------------------------------------------------------------------------
# Import Linter: a arquitetura verificada a cada commit
# ----------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: interfaces > bootstrap > infrastructure > application > domain"
type = "layers"
layers = [
    "app.interfaces",
    "app.bootstrap",
    "app.infrastructure",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domínio livre de frameworks e de infraestrutura"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "pydantic", "pydantic_settings", "alembic", "typer"]

[[tool.importlinter.contracts]]
name = "Aplicação livre de frameworks e de infraestrutura"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "pydantic", "pydantic_settings", "alembic", "typer"]

[[tool.importlinter.contracts]]
name = "Bounded contexts do domínio são independentes"
type = "independence"
modules = ["app.domain.task_management", "app.domain.notification"]

[[tool.importlinter.contracts]]
name = "Bounded contexts da aplicação são independentes"
type = "independence"
modules = ["app.application.task_management", "app.application.notification"]
