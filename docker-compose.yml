# Ambiente local: PostgreSQL + API. Credenciais apenas para desenvolvimento.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ddd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddd}
      POSTGRES_DB: ${POSTGRES_DB:-ddd}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ddd}:${POSTGRES_PASSWORD:-ddd}@db:5432/${POSTGRES_DB:-ddd}
      ENVIRONMENT: development
      LOG_FORMAT: json
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
