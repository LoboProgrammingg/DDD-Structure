# =============================================================================
# DDD Enterprise Template - Docker Compose
# =============================================================================
# Ambiente de desenvolvimento com todos os serviços necessários
#
# Uso:
#   docker-compose up -d        # Inicia todos os serviços
#   docker-compose logs -f api  # Acompanha logs da API
#   docker-compose down         # Para todos os serviços
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # API Principal
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddd-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_FORMAT=console
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # Mount para hot-reload em desenvolvimento
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ddd-network

  # ---------------------------------------------------------------------------
  # PostgreSQL (preparado para uso futuro)
