name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.1.3"

jobs:
  quality:
    name: Lint, tipos e arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Instalar dependências
        run: poetry install --no-interaction
      - name: Ruff (lint)
        run: poetry run ruff check .
      - name: Ruff (formatação)
        run: poetry run ruff format --check .
      - name: Mypy (strict)
        run: |
          poetry run mypy
          poetry run mypy tests
      - name: Contratos de arquitetura (import-linter)
        run: poetry run lint-imports

  test:
    name: Testes (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ddd
          POSTGRES_PASSWORD: ddd
          POSTGRES_DB: ddd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ddd -d ddd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ddd:ddd@localhost:5432/ddd
      DATABASE_URL: postgresql+asyncpg://ddd:ddd@localhost:5432/ddd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Instalar dependências
        run: poetry install --no-interaction
      - name: Migrações (upgrade, check, downgrade)
        run: |
          poetry run alembic upgrade head
          poetry run alembic check
          poetry run alembic downgrade base
      - name: Testes com cobertura
        run: poetry run pytest --cov --cov-report=term --cov-report=xml

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ddd-structure:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
